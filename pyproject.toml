[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipgaskeun"
version = "0.4.0"
description = "Potong video panjang jadi Shorts 9:16 dengan latar blur, subtitle otomatis, dan watermark. Lokal, gratis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["faster-whisper", "yt-dlp", "rich"]

[project.urls]
Homepage = "https://github.com/ululbiasaajaa/clipgaskeun"

[project.scripts]
clipgaskeun = "clipgaskeun:main"

[tool.setuptools]
py-modules = ["clipgaskeun"]
